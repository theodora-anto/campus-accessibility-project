server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — απαραίτητο για react-router-dom.
    # Χωρίς αυτό, refresh σε οποιοδήποτε route εκτός από "/" δίνει 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
