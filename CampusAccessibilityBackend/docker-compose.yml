services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest   
    container_name: campus-accessibility-db
    environment:
      ACCEPT_EULA: "Y"                                  
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"                
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - campus-accessibility-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5


  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: campus-accessibility-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./init-db.sql:/scripts/init-db.sql:ro
    entrypoint: >
      /opt/mssql-tools18/bin/sqlcmd -S db,1433 -U sa -P "${SA_PASSWORD}" -C
      -v DbName="${DB_NAME}" DbUser="${DB_USER}" DbUserPassword="${DB_USER_PASSWORD}"
      -i /scripts/init-db.sql
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-accessibility-api
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ConnectionStrings__DevConnection: "Server=${DB_HOST},1433;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_USER_PASSWORD};MultipleActiveResultSets=True;TrustServerCertificate=True"
      Jwt__SecretKey: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
# TODO: Αν cookie να το ξεσχολιάσω
    # volumes:
    #   - dataprotection-keys:/root/.aspnet/DataProtection-Keys
    volumes:
        - campus-accessibility-uploads:/app/wwwroot/uploads

    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../campus-accessibility-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL}"
        VITE_API_BASE_URL: "${VITE_API_BASE_URL}"
    container_name: campus-accessibility-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  campus-accessibility-db-data:
  campus-accessibility-uploads:

  # dataprotection-keys:  # TODO: Αν cookie να το ξεσχολιάσω

